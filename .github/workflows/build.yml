name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['project.zip']
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project.zip
        run: unzip -o project.zip
      - name: Decode keystore
        if: env.KS != ''
        run: echo "$KS" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then gradle assembleRelease --no-daemon; else gradle assembleDebug --no-daemon; fi
      - uses: actions/upload-artifact@v4
        with:
          name: player-apk
          path: app/build/outputs/apk/*/*.apk
          
